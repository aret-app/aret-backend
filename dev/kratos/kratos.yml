# Ory Kratos configuration for LOCAL DEVELOPMENT — ADR-0008.
# The database address (DSN) and secrets come from environment variables set in compose.yaml
# from your private .env; never put them in this file.
# Docs: https://www.ory.com/docs/kratos/reference/configuration

# Config format version; keep in sync with the image tag in compose.yaml
version: v26.2.0

serve:
  public:
    base_url: http://127.0.0.1:4433/
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  # The iOS app uses Kratos's API flows (/self-service/*/api). Kratos still requires browser UI
  # addresses; these point to a web UI we don't have yet.
  default_browser_return_url: http://127.0.0.1:4455/
  allowed_return_urls:
    - http://127.0.0.1:4455

  methods:
    password:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: http://127.0.0.1:4455/error
    settings:
      ui_url: http://127.0.0.1:4455/settings
    login:
      ui_url: http://127.0.0.1:4455/login
    registration:
      ui_url: http://127.0.0.1:4455/registration
      after:
        password:
          hooks:
            - hook: session   # sign the user in right after registering
    verification:
      enabled: true
      use: code
      ui_url: http://127.0.0.1:4455/verification
    recovery:
      enabled: true
      use: code
      ui_url: http://127.0.0.1:4455/recovery

# Password hashing: Argon2id (spec §9.2)
hashers:
  algorithm: argon2

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

# All emails go to Mailpit (http://127.0.0.1:8025), never to real inboxes
courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@aret.local
    from_name: Aret (dev)

log:
  level: info
  format: text
  leak_sensitive_values: false   # never log passwords, tokens or emails
