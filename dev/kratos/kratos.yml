# Ory Kratos configuration for LOCAL DEVELOPMENT — ADR-0008.
# The database address (DSN) and secrets come from environment variables set in compose.yaml
# from your private .env; never put them in this file.
# Docs: https://www.ory.com/docs/kratos/reference/configuration

# Config format version; keep in sync with the image tag in compose.yaml
version: v26.2.0

serve:
  public:
    # Reached through the local gateway (dev/gateway/Caddyfile), same address as the test web app,
    # so browser login cookies work. Port 4433 stays open for curl and the iOS Simulator.
    base_url: http://127.0.0.1:8080/kratos/
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  # Browser flows (cookies + CSRF) serve the test web app at http://127.0.0.1:8080 (dev/webapp/).
  # The iOS app uses the API flows (/self-service/*/api, session tokens) instead.
  default_browser_return_url: http://127.0.0.1:8080/
  allowed_return_urls:
    - http://127.0.0.1:8080
    - http://127.0.0.1:5500   # the console opened with VS Code Live Server

  methods:
    password:
      enabled: true
    code:
      enabled: true
      config:
        lifespan: 15m        # one-time codes (verification, recovery) expire after 15 minutes
        max_submissions: 5   # then the flow is locked: no brute-forcing the 6 digits

  flows:
    error:
      ui_url: http://127.0.0.1:8080/?flow-error
    settings:
      ui_url: http://127.0.0.1:8080/?settings
      # Changing the password needs a recent login (e.g. the one recovery just created)
      privileged_session_max_age: 15m
      after:
        password:
          hooks:
            # A new password signs out every other device: someone who knew the old
            # password loses access (aret-backend#15)
            - hook: revoke_active_sessions
    login:
      ui_url: http://127.0.0.1:8080/?login
    registration:
      ui_url: http://127.0.0.1:8080/?registration
      after:
        password:
          hooks:
            # Tell identity-svc about the new account (user.created, aret-backend#12). Fire-and-forget,
            # so sign-ups never wait for or fail on identity-svc; its catch-up loop finds lost calls.
            # Must stay first: hooks after `session` don't run for API flows.
            - hook: web_hook
              config:
                url: http://identity:8080/internal/kratos/registration
                method: POST
                body: file:///etc/config/kratos/webhook-registration.jsonnet
                response:
                  ignore: true
                auth:
                  type: api_key
                  config:
                    name: X-Aret-Webhook-Secret
                    in: header
                    # Real value from .env, set by compose.yaml:
                    # SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE
                    value: set-by-environment
            - hook: session               # sign the user in right after registering
            - hook: show_verification_ui  # tell the client which verification flow got the code
    verification:
      enabled: true
      use: code
      ui_url: http://127.0.0.1:8080/?verification
    recovery:
      # Forgot password: email → one-time code → signed in → settings flow sets a new password
      enabled: true
      use: code
      ui_url: http://127.0.0.1:8080/?recovery
      lifespan: 1h
      # Privacy: same answer for every address, and no email to addresses without an account,
      # so nobody can find out who has an Aret account
      notify_unknown_recipients: false

# Session → short-lived JWT for our services (aret-backend#3, crates/aret-auth):
#   GET /sessions/whoami?tokenize_as=aret   →  response field `tokenized`
# Signed ES256 with the private key generated by scripts/dev-env.sh; services verify it with the
# public half. Issuer = serve.public.base_url; audience added by jwt-claims.jsonnet.
session:
  whoami:
    tokenizer:
      templates:
        aret:
          ttl: 10m
          jwks_url: file:///etc/config/kratos-secrets/jwks.private.json
          claims_mapper_url: file:///etc/config/kratos/jwt-claims.jsonnet

# After a flow, Kratos says what comes next in a `continue_with` list instead of a browser redirect.
# Needed by the iOS app: without it, API recovery returns no session token (aret-backend#15).
feature_flags:
  use_continue_with_transitions: true

# Password hashing: Argon2id (spec §9.2)
hashers:
  algorithm: argon2

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

# All emails go to Mailpit (http://127.0.0.1:8025), never to real inboxes
courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@aret.local
    from_name: Aret (dev)

log:
  level: info
  format: text
  leak_sensitive_values: false   # never log passwords, tokens or emails
