# Aret backend workspace — ADR-0003 (one Cargo workspace, one binary/container per service)
[workspace]
resolver = "3"
members = ["crates/*", "services/*"]

# Settings every crate inherits with `field.workspace = true`
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/aret-app/aret-backend"
publish = false

# One place for dependency versions; crates opt in with `name.workspace = true`
[workspace.dependencies]
# our crates
aret-common = { path = "crates/aret-common" }
aret-auth = { path = "crates/aret-auth" }

# HTTP server
axum = "0.8.9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }

# logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# data and errors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.29", features = ["serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
base64 = "0.23"

# database: PostgreSQL + PostGIS (ADR-0002). Runtime-checked queries (no DATABASE_URL at build time);
# integration tests cover them. No TLS: the database is on the private Compose/cluster network.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "time", "migrate", "macros"] }

# auth: verify Kratos session JWTs (ES256). `rust_crypto` = pure-Rust crypto, no C toolchain needed
# for the static musl images.
jsonwebtoken = { version = "12.0", default-features = false, features = ["rust_crypto", "use_pem"] }

# tests only (call a router in-process with `oneshot`)
tower = { version = "0.5", features = ["util"] }
# tests only: generate throwaway ES256 keys at test time (never commit private keys).
# Same p256 major as jsonwebtoken; 0.13 pulls crypto-bigint 0.5 (RUSTSEC-2026-0387).
p256 = { version = "0.14", features = ["getrandom", "pem", "pkcs8"] }
# tests only: read the local .env (database password) in integration tests
dotenvy = "0.15"

# Lint rules every crate inherits with `[lints] workspace = true`.
# Code follows the Google Rust style guide: https://google.github.io/styleguide/rustguide.html
# CI runs clippy with `-D warnings`, so every warning below fails the build.
[workspace.lints.rust]
unsafe_code = "forbid"   # no `unsafe` in Aret services
missing_docs = "warn"    # doc comments on public APIs

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }   # includes ptr_arg, borrowed_box, wrong_self_convention, …
unwrap_used = "warn"                      # prefer patterns or `expect("reason")`; allowed in tests

# Small, fast release binaries
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
