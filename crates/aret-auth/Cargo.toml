[package]
name = "aret-auth"
description = "Request authentication for Aret services: Kratos session JWTs (ADR-0008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `aret_auth::testing`: throwaway signing keys for other crates' tests. Never enable in services.
test-support = ["dep:p256", "dep:base64"]

[dependencies]
aret-common.workspace = true
axum.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
p256 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
p256.workspace = true
tokio.workspace = true
tower.workspace = true

[lints]
workspace = true
